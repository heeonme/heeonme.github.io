<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="서울대학교 첨단융합학부 조희원의 개인 홈페이지">
  <title>조희원 | 개인 홈페이지</title>
  <style>
    :root{--navy:#15304f;--blue:#2468a8;--mist:#eaf3fb;--ink:#182431}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.7;background:linear-gradient(145deg,#f7fbff,var(--mist))}main{width:min(100% - 2rem,760px);margin:auto;padding:clamp(3.5rem,11vw,6.5rem) 0 3rem}.intro{display:flex;align-items:center;gap:clamp(1.25rem,5vw,2.5rem);padding:clamp(2rem,7vw,4rem);color:#fff;background:var(--navy);border-radius:1.5rem 1.5rem 0 0}.profile-photo{width:clamp(6.5rem,22vw,10rem);aspect-ratio:1;flex:0 0 auto;object-fit:cover;border:.25rem solid #c9e4fb;border-radius:50%;box-shadow:0 .7rem 1.5rem rgba(0,0,0,.2)}.eyebrow{margin:0 0 .7rem;color:#b9dcff;font-size:.9rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}h1,h2,p{margin-top:0}h1{margin-bottom:.55rem;font-size:clamp(2.3rem,8vw,4rem);letter-spacing:-.06em;line-height:1.15}.department{margin:0;color:#d9eaff;font-size:clamp(1rem,3vw,1.15rem)}.content{display:grid;gap:1rem;padding:clamp(1.2rem,4vw,2rem);background:#fff;border-radius:0 0 1.5rem 1.5rem;box-shadow:0 1.2rem 3rem rgba(22,54,87,.13)}section{padding:1.35rem;background:#f8fbfe;border:1px solid #dceaf6;border-radius:1rem}h2{margin-bottom:.65rem;color:var(--blue);font-size:1.05rem}.interest{display:inline-block;margin:0;padding:.35rem .8rem;color:#0d4e84;font-weight:700;background:#dcedfb;border-radius:999px}.contact a{color:var(--navy);font-size:1.15rem;font-weight:700;text-underline-offset:.2em}footer{padding:1.6rem 0 0;color:#617080;font-size:.88rem;text-align:center}@media(max-width:420px){main{width:min(100% - 1.25rem,760px);padding-top:1.25rem}.intro{align-items:flex-start;border-radius:1.1rem 1.1rem 0 0}.content{border-radius:0 0 1.1rem 1.1rem}section{padding:1.15rem}}
  </style>
</head>
<body>
  <main>
    <header class="intro"><img class="profile-photo" src="assets/profile.jpg" alt="조희원 프로필 사진"><div><p class="eyebrow">Personal Homepage</p><h1>조희원</h1><p class="department">서울대학교 첨단융합학부</p></div></header>
    <div class="content">
      <section><h2>소개</h2><p>안녕하세요. 서울대학교 첨단융합학부의 조희원입니다.</p></section>
      <section><h2>관심사</h2><p class="interest">데이터 사이언스</p></section>
      <section class="contact"><h2>연락처</h2><a href="mailto:bella29@snu.ac.kr">bella29@snu.ac.kr</a></section>
    </div>
    <footer>© 2026 조희원</footer>
  </main>
</body>
</html>
